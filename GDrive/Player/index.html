<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>AtoZCartoonist (GDrive)</title>
    <meta name="robots" content="noindex"/>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="https://www.atozcartoonist.com/favicon.ico"/>
    
    <style>
        :root {
            /* Default is dark */
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --orb-1: #3b82f6;
            --orb-2: #8b5cf6;
        }

        [data-theme="light"] {
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --orb-1: #93c5fd;
            --orb-2: #c084fc;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            color: var(--text-main);
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Abstract Background Orbs for Dark Mode */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: -1;
            opacity: 0.4;
            transition: background 0.5s ease;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--orb-1); top: -100px; left: -100px; animation: float 10s ease-in-out infinite alternate; }
        .orb-2 { width: 500px; height: 500px; background: var(--orb-2); bottom: -150px; right: -150px; animation: float 12s ease-in-out infinite alternate-reverse; }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(30px); }
        }
        
        /* Theme Toggle Button */
        .theme-toggle {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .header {
            width: 100%;
            max-width: 900px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
            padding: 20px 0;
        }

        .logo {
            height: 40px;
            filter: drop-shadow(0px 2px 4px rgba(0,0,0,0.5));
        }

        .back-btn {
            color: var(--text-muted);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-btn:hover {
            color: var(--text-main);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 20px;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            margin-bottom: 30px;
            transition: background 0.5s ease, border 0.5s ease;
        }

        .tabs {
            display: flex;
            gap: 20px;
            margin-bottom: 15px;
            border-bottom: 1px solid var(--card-border);
            padding-bottom: 15px;
        }

        .tab {
            font-weight: 600;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 15px;
        }

        .tab.active {
            color: var(--primary);
        }

        .video-container {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-primary:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
        }

        .btn-telegram {
            background: #2AABEE;
            color: white;
        }

        .btn-telegram:hover {
            background: #229ED9;
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
            margin-top: auto;
            padding: 20px 0;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
    
        /* Mobile Responsive Fixes */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .glass-card {
                padding: 15px;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 10px 0;
            }
            .logo {
                height: auto;
                max-width: 250px;
            }

            .tabs {
                gap: 10px;
                font-size: 13px;
                justify-content: center;
                flex-wrap: wrap;
            }
            .btn {
                width: 100%;
                font-size: 13px;
                padding: 12px 10px;
            }
            .actions {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

    <script>
        // Check local storage for theme
        const savedTheme = localStorage.getItem('theme') || 'dark'; // Player defaults to dark
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>
    



    <script>
        function getUrlVars() {
            var vars = {};
            var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function (m, key, value) {
                vars[key] = value;
            });
            return vars;
        }
        var fileId = getUrlVars()["id"];
    </script>

    <div class="header">
        <a href="/">
            <img class="logo" src="http://4.bp.blogspot.com/-tyI9VhNYz3s/YCpnEA4zceI/AAAAAAAADqo/Vsd082M2aUoA0M_iF78j00uuV22Br0q3ACK4BGAYYCw/s1600/20210215_014220.png" alt="AtoZCartoonist">
        </a>
        <div style="display: flex; align-items: center; gap: 15px;">
            <script>
                document.write('<a href="/GDrive/?id=' + fileId + '" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back</a>');
            </script>
            <button class="theme-toggle" id="themeToggle">
                <i class="fa-solid fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </div>

    <div class="glass-card">
        <div class="tabs">
            <div class="tab active"><i class="fa-solid fa-play"></i> Watch Online</div>
            <div class="tab"><i class="fa-brands fa-google-drive"></i> Google Drive</div>
        </div>

        <div class="video-container">
            <script>
                document.write('<iframe src="https://drive.google.com/file/d/' + fileId + '/preview" allow="autoplay; encrypted-media" allowfullscreen></iframe>');
            </script>
        </div>

        <div class="actions">
            <a href="/" class="btn btn-primary"><i class="fa-solid fa-home"></i> Visit AtoZ Cartoonist</a>
            <a href="https://telegram.me/+BIkPgyw4y4lkYmVl" class="btn btn-telegram" target="_blank"><i class="fa-brands fa-telegram"></i> Join Telegram Channel</a>
        </div>
    </div>

    <footer>
        <p>AtoZCartoonist (GDrive) is affiliated with <a href="/">AtoZCartoonist</a> but does not host any files on its servers.</p>
        <p>Copyright &copy; 2026 <a href="/">AtoZCartoonist</a></p>
    </footer>

    <script>
        // Set correct icon on load
        const themeIcon = document.getElementById('themeIcon');
        if (savedTheme === 'dark') {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // Toggle Theme
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            if (newTheme === 'dark') {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>

</body>
</html>
