<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
    <meta content="width=device-width,initial-scale=1" name="viewport"/>
    <title>AtoZCartoonist (GDrive)</title>
    <meta name="robots" content="noindex"/>
    
    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
    <link rel="icon" type="image/png" href="https://www.atozcartoonist.com/favicon.ico"/>
    
    <style>
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --bg-gradient: linear-gradient(135deg, #e0e7ff 0%, #f3e8ff 100%);
            --card-bg: rgba(255, 255, 255, 0.7);
            --card-border: rgba(255, 255, 255, 0.4);
            --text-main: #0f172a;
            --text-muted: #64748b;
            --btn-download-bg: white;
            --btn-download-border: #e2e8f0;
            --btn-download-hover: #f8fafc;
            --orb-1: #93c5fd;
            --orb-2: #c084fc;
        }

        [data-theme="dark"] {
            --bg-gradient: radial-gradient(circle at 50% 0%, #1e293b 0%, #0f172a 70%);
            --card-bg: rgba(30, 41, 59, 0.7);
            --card-border: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --btn-download-bg: #1e293b;
            --btn-download-border: rgba(255,255,255,0.1);
            --btn-download-hover: #334155;
            --orb-1: #3b82f6;
            --orb-2: #8b5cf6;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-gradient);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            padding: 20px;
            transition: background 0.5s ease, color 0.5s ease;
        }

        /* Abstract Background Orbs */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
            transition: background 0.5s ease;
        }
        .orb-1 { width: 400px; height: 400px; background: var(--orb-1); top: -100px; left: -100px; animation: float 10s ease-in-out infinite alternate; }
        .orb-2 { width: 500px; height: 500px; background: var(--orb-2); bottom: -150px; right: -150px; animation: float 12s ease-in-out infinite alternate-reverse; }

        @keyframes float {
            0% { transform: translateY(0px); }
            100% { transform: translateY(30px); }
        }

        /* Theme Toggle Button */
        .theme-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-main);
            width: 45px;
            height: 45px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
            z-index: 100;
        }

        .theme-toggle:hover {
            transform: scale(1.1);
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--card-border);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            margin-bottom: 30px;
            transition: background 0.5s ease, border 0.5s ease;
        }

        .logo {
            width: 100%;
            max-width: 280px;
            height: auto;
            margin-bottom: 30px;
            filter: drop-shadow(0px 4px 6px rgba(0,0,0,0.1));
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 10px;
            color: var(--text-main);
        }

        p.subtitle {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 16px 24px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: none;
        }

        .btn-play {
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.3);
        }

        .btn-play:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.4);
        }

        .btn-download {
            background: var(--btn-download-bg);
            color: var(--text-main);
            border: 1px solid var(--btn-download-border);
        }

        .btn-download:hover {
            background: var(--btn-download-hover);
            transform: translateY(-2px);
        }

        .telegram-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            background: #2AABEE;
            color: white;
            padding: 12px 24px;
            border-radius: 30px;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .telegram-btn:hover {
            background: #229ED9;
            transform: scale(1.05);
        }

        footer {
            text-align: center;
            font-size: 12px;
            color: var(--text-muted);
            max-width: 600px;
            line-height: 1.6;
        }

        footer a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        footer a:hover {
            text-decoration: underline;
        }
    
        /* Mobile Responsive Fixes */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .glass-card {
                padding: 15px;
            }
            .header {
                flex-direction: column;
                gap: 15px;
                padding: 10px 0;
            }
            .logo {
                height: auto;
                max-width: 250px;
            }
            .btn {
                width: 100%;
                font-size: 14px;
            }
            .action-buttons {
                flex-direction: column;
                gap: 10px;
            }
        }
    </style>

    <script>
        // Check local storage for theme
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
</head>
<body>

    <!-- Background Orbs -->
    <div class="bg-orb orb-1"></div>
    <div class="bg-orb orb-2"></div>

    <button class="theme-toggle" id="themeToggle">
        <i class="fa-solid fa-moon" id="themeIcon"></i>
    </button>

    <script>
        // Set correct icon on load
        const themeIcon = document.getElementById('themeIcon');
        if (savedTheme === 'dark') {
            themeIcon.classList.replace('fa-moon', 'fa-sun');
        }

        // Toggle Theme
        document.getElementById('themeToggle').addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
            
            if (newTheme === 'dark') {
                themeIcon.classList.replace('fa-moon', 'fa-sun');
            } else {
                themeIcon.classList.replace('fa-sun', 'fa-moon');
            }
        });
    </script>

    <script>
        // Get URL parameter securely
        function getUrlVars() {
            var vars = {};
            var parts = window.location.href.replace(/[?&]+([^=&]+)=([^&]*)/gi, function (m, key, value) {
                vars[key] = value;
            });
            return vars;
        }
        var fileId = getUrlVars()["id"];
    </script>

    <div class="glass-card">
        <a href="/">
            <img class="logo" src="http://4.bp.blogspot.com/-tyI9VhNYz3s/YCpnEA4zceI/AAAAAAAADqo/Vsd082M2aUoA0M_iF78j00uuV22Br0q3ACK4BGAYYCw/s1600/20210215_014220.png" alt="AtoZCartoonist">
        </a>
        
        <h1>Your file is ready!</h1>

        <div class="action-buttons">
            <script>
                document.write('<a href="/GDrive/Player/?id=' + fileId + '" class="btn btn-play"><i class="fa-solid fa-play"></i> Watch Online</a>');
                document.write('<a href="https://drive.google.com/uc?id=' + fileId + '&export=download" class="btn btn-download"><i class="fa-solid fa-download"></i> Direct Download</a>');
            </script>
        </div>
        
        <div style="border-top: 1px solid var(--card-border); padding-top: 25px; margin-top: 10px;">
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 10px;">Stay updated with our latest releases:</p>
            <a href="https://telegram.me/+BIkPgyw4y4lkYmVl" class="telegram-btn" target="_blank">
                <i class="fa-brands fa-telegram"></i> Join Telegram Channel
            </a>
        </div>
    </div>

    <footer>
        <p>AtoZCartoonist (GDrive) is affiliated with <a href="/">AtoZCartoonist</a> but does not host any files on its servers. All files are hosted on third-party websites.</p>
        <p style="margin-top: 10px;">Copyright &copy; 2026 <a href="/">AtoZCartoonist</a></p>
    </footer>

</body>
</html>
